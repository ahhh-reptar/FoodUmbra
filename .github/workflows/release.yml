name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Get Umbra dependencies
        run: |
          git clone --depth 1 https://github.com/una-xiv/umbra-dist.git ../umbra-dist

      - name: Build
        run: |
          dotnet build FoodUmbra/FoodUmbra.csproj \
            --configuration Release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Release/FoodUmbra.dll
